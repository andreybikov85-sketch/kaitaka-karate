<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ПУТЬ КАЙТАКА</title>
<link rel="stylesheet" href="src/style.css">

<!--
  Карта модулей: превращает короткое имя "three" в путь к файлу в vendor/.
  Благодаря ей файлы three.js подключаются как есть, без npm и без сборщика,
  а внутренние импорты вида "three/addons/..." тоже находят свои файлы.
-->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/"
  }
}
</script>
</head>
<body>

<canvas id="view"></canvas>

<!-- Интерфейс — обычный HTML поверх 3D, а не рисование внутри canvas -->
<div id="ui">
  <div id="hud">
    <div id="belt">
      <span id="belt-swatch"></span>
      <span id="hero-name">—</span>
      <span id="belt-name"></span>
      <b id="belt-rank"></b>
    </div>
  </div>

  <button id="view-btn" data-k="view" title="Сменить вид (V)">
    <span id="view-icon">◱</span><span id="view-text">СБОКУ</span>
  </button>

  <!-- Режим движения. Фигурка понятнее надписи: стоит — тренировка,
       в стойке — поединок. Читается, не зная ни русского, ни японского. -->
  <button id="mode" data-k="mode" data-mode="kumite"
          title="Тренировка или кумитэ (T)" aria-label="Режим: кумитэ">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <g id="fig-stand" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="4.6" r="2.5" fill="currentColor" stroke="none"/>
        <path d="M12 7.6V15"/>
        <path d="M12 9.4 8.9 14.2M12 9.4l3.1 4.8"/>
        <path d="M12 15l-1.9 6M12 15l1.9 6"/>
      </g>
      <g id="fig-kamae" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12.6" cy="4.6" r="2.5" fill="currentColor" stroke="none"/>
        <path d="M12.6 7.4 11.6 14.4"/>
        <path d="M12.2 9 8.6 11.2l2.6 1.4M12.4 9.4l3.5 2.4-2.4 1.5"/>
        <path d="M11.6 14.4 7.9 17.6 7.2 21.2M11.6 14.4l4.3 2.6.9 4.2"/>
      </g>
    </svg>
  </button>

  <!-- Панель задания: снаряды и время -->
  <div id="task" class="hidden">
    <div id="task-bars"></div>
    <div id="task-timer">1:00</div>
  </div>

  <div id="hint">Стрелки — движение · J — цуки · K — гери</div>

  <div id="pad">
    <div class="dpad">
      <span></span><button class="k" data-k="up">▲</button><span></span>
      <button class="k" data-k="left">◀</button><span></span><button class="k" data-k="right">▶</button>
      <span></span><button class="k" data-k="down">▼</button><span></span>
    </div>
  </div>

  <!-- Четыре кнопки действий. Подписи меняются вместе с режимом,
       клавиши остаются те же: J, K, L и пробел. -->
  <div id="acts">
    <button class="k act" data-k="a3" data-slot="2"></button>
    <button class="k act" data-k="a4" data-slot="3"></button>
    <button class="k act" data-k="a1" data-slot="0"></button>
    <button class="k act" data-k="a2" data-slot="1"></button>
  </div>
</div>

<!-- Экран входа: имя и персонаж -->
<div id="start" class="hidden">
  <img class="mark" src="assets/logo.png" alt="Эмблема клуба КАЙТАКА" width="200" height="188">
  <h1>ПУТЬ КАЙТАКА</h1>
  <p class="sub">от белого пояса до чёрного</p>

  <label for="name">КАК ТЕБЯ ЗОВУТ?</label>
  <input id="name" type="text" autocomplete="off" autocapitalize="words"
         spellcheck="false" placeholder="имя">

  <p class="label">КЕМ БУДЕШЬ?</p>
  <div class="choice">
    <button class="who" data-hero="boy" aria-pressed="true">
      <img src="assets/ui/boy.png" alt="Мальчик в белом кимоно" width="355" height="640">
      <span>МАЛЬЧИК</span>
    </button>
    <button class="who" data-hero="girl" aria-pressed="false">
      <img src="assets/ui/girl.png" alt="Девочка в белом кимоно" width="296" height="640">
      <span>ДЕВОЧКА</span>
    </button>
  </div>

  <button id="begin" disabled>НАЧАТЬ ПУТЬ</button>
</div>

<!-- Сэнсэй объясняет задание -->
<div id="brief" class="hidden">
  <img id="brief-face" alt="Сэнсэй" hidden>
  <div class="who-said">先生　СЭНСЭЙ</div>
  <div id="brief-text"></div>
  <button id="brief-go">ОСУ!</button>
</div>

<!-- Итог этапа -->
<div id="done" class="hidden" data-won="0">
  <div id="done-text"></div>
  <div id="done-sub"></div>
  <button id="done-go">ЕЩЁ РАЗ</button>
</div>

<div id="loading">
  <img class="mark" src="assets/logo.png" alt="Эмблема клуба КАЙТАКА" width="200" height="188">
  <div class="load-title">ПУТЬ КАЙТАКА</div>
  <div class="load-sub">загрузка…</div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
