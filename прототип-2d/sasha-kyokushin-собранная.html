<style>

  --night-2:#1d2333;
  --tatami:#2f5d50;
  --kyoku:#c1272d;
  --club:#3f3a8c;
  --gi:#f2ede2;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(120% 80% at 50% -10%, #26304a 0%, var(--night) 60%, #0d1017 100%);
  color:var(--gi);
  font-family:system-ui,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  padding:14px 10px 20px;gap:10px;

header{display:flex;align-items:center;gap:12px;width:100%;max-width:920px}
.kanji{

}
h1{

  font-size:15px;letter-spacing:.22em;margin:0;font-weight:900;
}

#sound{

canvas{
  width:100%;height:auto;display:block;

}
.pad{width:100%;max-width:920px;display:flex;justify-content:space-between;gap:14px;user-select:none}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,44px);gap:4px}
.acts{display:grid;grid-template-columns:repeat(2,74px);grid-template-rows:repeat(2,44px);gap:6px;align-self:end}

  background:#1d2333;border:1px solid #3b4560;color:#c8d0e2;border-radius:3px;

}
button.k:active,button.k.on{background:var(--club);border-color:var(--club);color:#fff}
.dpad .sp{visibility:hidden}
.keys{
  width:100%;max-width:920px;font-size:11px;color:#78829a;letter-spacing:.05em;
  display:flex;flex-wrap:wrap;gap:4px 18px;line-height:1.6;
}
.keys b{color:#c8d0e2;font-weight:700}
@media (max-width:700px){
  h1{font-size:12px}
  .dpad{grid-template-columns:repeat(3,46px)}
  .acts{grid-template-columns:repeat(2,66px)}
}

</style>

<header>
  <div class="kanji">鷹</div>
  <h1>САША — ПУТЬ КИОКУШИН<small>КАЙТАКА · МУРОМ · ДО ЧЁРНОГО ПОЯСА</small></h1>

<div class="pad">

  </div>

    <button class="k" data-k="punch">ЦУКИ</button>
    <button class="k" data-k="kick">ГЕРИ</button>
    <button class="k" data-k="block">БЛОК</button>
    <button class="k" data-k="kiai">КИАЙ</button>
  </div>
</div>

<div class="keys">
  <span><b>◀ ▶ ▲ ▼</b> движение</span>
  <span><b>J</b> цуки — удар рукой</span>
  <span><b>K</b> гери — удар ногой</span>
  <span><b>L</b> блок</span>
  <span><b>ПРОБЕЛ</b> киай — когда шкала духа полна</span>
  <span><b>ENTER</b> дальше</span>
  <span><b>P</b> пауза</span>
</div>

<script>
(() => {
"use strict";
/* ===== src/config.js ===== */
// Константы игры: размеры холста, пояса, уровни, типы противников.
// Правки баланса делай здесь — код логики трогать не нужно.
const W = 480;
const H = 270;

// Пояса киокушинкай по порядку. c — цвет пояса, s — цвет полоски.
const BELTS = [
  { n:"Синий с жёлтой полоской", kyu:"7 кю", c:"#2f6fd0", s:"#f2c832" },
  { n:"Жёлтый",                  kyu:"6 кю", c:"#f2c832", s:null      },
  { n:"Жёлтый с зелёной полоской",kyu:"5 кю", c:"#f2c832", s:"#2b8a4a" },
  { n:"Зелёный",                 kyu:"4 кю", c:"#2b8a4a", s:null      },
  { n:"Зелёный с коричневой полоской",kyu:"3 кю", c:"#2b8a4a", s:"#7a4b20" },
  { n:"Коричневый",              kyu:"2 кю", c:"#7a4b20", s:null      },
  { n:"Коричневый с чёрной полоской",kyu:"1 кю", c:"#7a4b20", s:"#15151c" },
  { n:"Чёрный",                  kyu:"1 дан", c:"#15151c", s:"#e8b647" },
  { n:"Чёрный",                  kyu:"1 дан", c:"#15151c", s:"#e8b647" }
];

// Уровни. waves — волны противников до босса, каждая запись [тип, количество].
const LEVELS = [
  { name:"ДОДЗЁ",           jp:"道場",  theme:"dojo",
    waves:[[["makiwara",2]],[["makiwara",2],["kohai",1]],[["kohai",2]]],
    boss:{ type:"bag", name:"ТЯЖЁЛЫЙ МЕШОК", hp:90 },
    tip:"J — цуки. K — гери. L — блок. Разбей макивары." },
  { name:"ШКОЛЬНЫЙ ДВОР",   jp:"校庭",  theme:"yard",
    waves:[[["kohai",2]],[["kohai",3]],[["kohai",2],["hayai",1]]],
    boss:{ type:"kohai", name:"СЭМПАЙ КУМА", hp:130, big:1 },
    tip:"Держись сбоку — бей и отходи." },
  { name:"ПАРК",            jp:"公園",  theme:"park",
    waves:[[["kohai",2],["thrower",1]],[["thrower",2]],[["kohai",2],["thrower",1]]],
    boss:{ type:"thrower", name:"МЯЧ-МАСТЕР ТАКА", hp:150, big:1 },
    tip:"Мяч летит по прямой — сойди вверх или вниз." },
  { name:"СТАРЫЙ СПОРТЗАЛ", jp:"体育館", theme:"gym",
    waves:[[["kohai",3]],[["kabe",1],["kohai",2]],[["kabe",2],["hayai",1]]],
    boss:{ type:"kabe", name:"СТЕНА ОКАМИ", hp:180, big:1 },
    tip:"Кто держит блок — ждёт. Бей сразу после его атаки." },
  { name:"КРЫШИ ГОРОДА",    jp:"屋根",  theme:"roofs",
    waves:[[["hayai",3]],[["hayai",2],["thrower",1]],[["hayai",3],["kohai",1]]],
    boss:{ type:"hayai", name:"ТЕНЬ КАГЭ", hp:190, big:1 },
    tip:"Быстрые бьют первыми — блокируй и отвечай." },
  { name:"МОСТ",            jp:"橋",    theme:"bridge",
    waves:[[["kohai",2],["hayai",2]],[["thrower",2],["kabe",1]],[["hayai",2],["kabe",2]]],
    boss:{ type:"kohai", name:"ОНИ С МОСТА", hp:200, big:1 },
    tip:"Копи дух и бей КИАЙ, когда окружают." },
  { name:"ГОРНЫЙ ХРАМ",     jp:"山寺",  theme:"temple",
    waves:[[["kabe",2],["thrower",1]],[["hayai",3],["kabe",1]],[["kabe",2],["kohai",2],["thrower",1]]],
    boss:{ type:"kabe", name:"ТЭНГУ ХРАМА", hp:215, big:1 },
    tip:"Не спеши. Один удар — шаг назад." },
  { name:"ФИНАЛЬНЫЙ ТАТАМИ",jp:"畳",    theme:"tatami",
    waves:[[["kohai",2],["hayai",2]],[["kabe",2],["thrower",2]]],
    boss:{ type:"sensei", name:"СЭНСЭЙ КУРО", hp:250, big:1 },
    tip:"Три фазы. Он ускоряется — держи дистанцию." }
];

// Характеристики противников.
// hp — здоровье, sp — скорость, dmg — урон, reach — дальность атаки,
// cd — пауза между атаками (сек), guard — умеет блокировать, ranged — бьёт издалека,
// stat — неподвижная цель (макивара, мешок).
const TYPES = {
  makiwara:{ hp:26, sp:0,   dmg:0,  reach:0,  cd:99, gi:"#8a6b45", belt:"#5c452c", label:"макивара", stat:1 },
  kohai:   { hp:40, sp:26,  dmg:8,  reach:26, cd:1.5, gi:"#dfe4ee", belt:"#f2c832", label:"кохай" },
  thrower: { hp:34, sp:22,  dmg:9,  reach:150,cd:2.0, gi:"#d8dbc8", belt:"#2f6fd0", label:"метатель", ranged:1 },
  hayai:   { hp:30, sp:52,  dmg:7,  reach:24, cd:0.95,gi:"#cfd6e6", belt:"#2b8a4a", label:"быстрый" },
  kabe:    { hp:70, sp:20,  dmg:11, reach:27, cd:1.9, gi:"#c9c2b4", belt:"#7a4b20", label:"блокирующий", guard:1 },
  bag:     { hp:90, sp:0,   dmg:0,  reach:0,  cd:99, gi:"#7a4b20", belt:"#4a2c14", label:"мешок", stat:1 },
  sensei:  { hp:340,sp:34,  dmg:11, reach:30, cd:1.25,gi:"#2b2f3d", belt:"#15151c", label:"сэнсэй", guard:1 }
};

/* ===== src/audio.js ===== */
// Звук. Всё синтезируется через WebAudio — звуковых файлов в проекте нет.

let soundOn = true;
let actx = null;

// Контекст создаётся только после действия пользователя — таково требование браузеров.
function ac(){
  if(!actx){
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ /* звука не будет, игра работает дальше */ }
  }
  return actx;
}
function isSoundOn(){ return soundOn; }
function toggleSound(){
  soundOn = !soundOn;
  if(soundOn){ ac(); S.pick(); }
  return soundOn;
}

function beep(freq, dur, type, vol, slide){
  if(!soundOn) return;
  const a = ac(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || "square";
  o.frequency.setValueAtTime(freq, a.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), a.currentTime + dur);
  g.gain.setValueAtTime(vol || 0.08, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur + 0.02);
}

function noise(dur, vol){
  if(!soundOn) return;
  const a = ac(); if(!a) return;
  const n = a.sampleRate * dur;
  const buf = a.createBuffer(1, n, a.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(); s.buffer = buf;
  const g = a.createGain(); g.gain.value = vol || 0.12;
  s.connect(g); g.connect(a.destination);
  s.start();
}
const S = {
  punch(){ beep(320, 0.06, "square", 0.05, 180); noise(0.05, 0.06); },
  hit(){ noise(0.09, 0.14); beep(180, 0.08, "square", 0.06, 90); },
  kick(){ beep(220, 0.09, "sawtooth", 0.06, 120); noise(0.07, 0.1); },
  block(){ beep(140, 0.07, "triangle", 0.07, 110); },
  hurt(){ beep(150, 0.16, "sawtooth", 0.07, 70); },
  kiai(){ beep(520, 0.28, "square", 0.09, 120); noise(0.22, 0.16); },
  pick(){ beep(660, 0.07, "triangle", 0.07); beep(990, 0.09, "triangle", 0.06); },
  down(){ beep(120, 0.3, "sawtooth", 0.08, 50); },
  throwBall(){ beep(400, 0.08, "triangle", 0.05, 240); },
  belt(){ [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.18, "triangle", 0.07), i * 130)); },
  lose(){ [392, 349, 294, 220].forEach((f, i) => setTimeout(() => beep(f, 0.25, "triangle", 0.07), i * 180)); }
};

/* ===== src/input.js ===== */
// Ввод: клавиатура и экранные кнопки для планшета.
//
// keys[k]  — кнопка удерживается прямо сейчас
// took(k)  — кнопка была нажата и это нажатие ещё не обработано (сбрасывается при чтении)
const keys = {
  up: 0, down: 0, left: 0, right: 0,
  punch: 0, kick: 0, block: 0, kiai: 0,
  enter: 0, pause: 0
};

const pressed = {};

const MAP = {
  ArrowUp: "up",    KeyW: "up",
  ArrowDown: "down", KeyS: "down",
  ArrowLeft: "left", KeyA: "left",
  ArrowRight: "right", KeyD: "right",
  KeyJ: "punch", KeyZ: "punch",
  KeyK: "kick",  KeyX: "kick",
  KeyL: "block", KeyC: "block",
  Space: "kiai",
  Enter: "enter",
  KeyP: "pause", Escape: "pause"
};

const DIRS = new Set(["up", "down", "left", "right"]);
function took(k){
  if(pressed[k]){ pressed[k] = 0; return true; }
  return false;
}
function initInput(cv){
  addEventListener("keydown", e => {
    const k = MAP[e.code];
    if(!k) return;
    e.preventDefault();
    if(!keys[k]) pressed[k] = 1;
    keys[k] = 1;
    ac();
  });

  addEventListener("keyup", e => {
    const k = MAP[e.code];
    if(!k) return;
    e.preventDefault();
    keys[k] = 0;
  });

  // Экранные кнопки. Крестовина не подтверждает экраны — иначе меню проскакивает.
  document.querySelectorAll("button.k").forEach(b => {
    const k = b.dataset.k;
    const isDir = DIRS.has(k);

    const on = e => {
      e.preventDefault();
      if(!keys[k]) pressed[k] = 1;
      keys[k] = 1;
      if(!isDir){ keys.enter = 1; pressed.enter = 1; }
      b.classList.add("on");
      ac();
    };
    const off = e => {
      e.preventDefault();
      keys[k] = 0;
      if(!isDir) keys.enter = 0;
      b.classList.remove("on");
    };

    b.addEventListener("pointerdown", on);
    b.addEventListener("pointerup", off);
    b.addEventListener("pointerleave", off);
    b.addEventListener("pointercancel", off);
  });

  // Касание холста — подтверждение на экранах заставок.
  cv.addEventListener("pointerdown", e => {
    e.preventDefault();
    pressed.enter = 1;
    keys.enter = 1;
    ac();
  });
  cv.addEventListener("pointerup", () => { keys.enter = 0; });
}

/* ===== src/state.js ===== */
// Общее состояние игры. Все модули читают и меняют объект G.
//
// G.state — какой экран сейчас активен:
//   title | intro | play | pause | belt | gameover | win
const G = {
  state: "title",
  unlocked: 1,      // сколько уровней открыто
  selLevel: 0,      // выбранный в меню уровень
  lvl: 0,
  beltIdx: 0,
  lives: 3,
  seg: 0,           // номер текущей волны
  bossFight: false,
  cleared: false,   // волна зачищена, идёт переход к следующей
  camX: 0,
  t: 0,             // общее время, для анимаций
  shake: 0,
  flash: 0,
  msg: null,
  msgT: 0,
  screenT: 0,       // время на текущем экране
  enemies: [],
  shots: [],
  items: [],
  fx: []
};
const P = {
  x: 60, y: 220, z: 0, vz: 0,
  facing: 1,
  hp: 100, maxhp: 100,
  spirit: 0,
  st: "idle", stT: 0,
  inv: 0,            // неуязвимость после получения урона
  anim: 0,
  hits: null,        // кого уже задел текущий удар
  dead: false
};

const SAVE_KEY = "sasha-kyokushin-progress";
function loadProgress(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && d.unlocked >= 1 && d.unlocked <= LEVELS.length) G.unlocked = d.unlocked;
    }
  } catch(e){ /* приватный режим — играем без сохранения */ }
}
function saveProgress(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ unlocked: G.unlocked })); }
  catch(e){ /* не критично */ }
}

// Рост сложности по уровням. Урон растёт медленнее здоровья — так честнее для ребёнка.
function mul(){
  return { hp: 1 + G.lvl * 0.10, sp: 1 + G.lvl * 0.05, dmg: 1 + G.lvl * 0.06 };
}
function resetPlayer(full){
  P.x = G.camX + 60;
  P.y = 225; P.z = 0; P.vz = 0;
  P.facing = 1;
  P.st = "idle"; P.stT = 0;
  P.inv = 1.2;
  P.dead = false;
  P.anim = 0;
  P.hp = P.maxhp;
  if(full) P.spirit = 0;
}
function startLevel(i){
  G.lvl = i;
  G.beltIdx = i;
  G.lives = 3;
  G.seg = 0;
  G.bossFight = false;
  G.cleared = false;
  G.camX = 0;
  G.enemies = []; G.shots = []; G.items = []; G.fx = [];
  resetPlayer(true);
  G.state = "intro";
  G.screenT = 0;
}
function makeEnemy(type, x, y, o){
  const T = TYPES[type];
  return {
    type, x, y, z: 0, vz: 0, facing: -1,
    hp: o.hp, maxhp: o.hp,
    dmg: o.dmg !== undefined ? o.dmg : T.dmg,
    sp: o.sp !== undefined ? o.sp : T.sp,
    big: o.big || 1,
    boss: o.boss || 0,
    name: o.name || "",
    st: "walk", stT: 0,
    cd: 0.6 + Math.random() * 0.8,
    guardT: 0, hurt: 0, dying: 0,
    anim: Math.random() * 6,
    didHit: 0,
    phase: 1,
    entered: false
  };
}
function spawnWave(){
  const L = LEVELS[G.lvl], m = mul();
  G.enemies = [];

  if(G.seg >= L.waves.length){
    // Босс уровня.
    G.bossFight = true;
    const b = L.boss, T = TYPES[b.type];
    G.enemies.push(makeEnemy(b.type, G.camX + W - 70, 220, {
      hp: Math.round(b.hp * (1 + G.lvl * 0.05)),
      big: 1.35, boss: 1, name: b.name,
      dmg: Math.round(T.dmg * m.dmg),
      sp: T.sp * m.sp * 1.05
    }));
    G.msg = b.name; G.msgT = 2.2;
    S.down();
  } else {
    let n = 0;
    L.waves[G.seg].forEach(([type, count]) => {
      for(let i = 0; i < count; i++){
        const T = TYPES[type];
        // Неподвижные цели ставим внутри арены, живые входят сбоку.
        const sx = T.stat ? (G.camX + 170 + n * 66) : (G.camX + W + 24 + n * 34);
        G.enemies.push(makeEnemy(type, sx, 186 + ((n * 37) % 62), {
          hp: Math.round(T.hp * m.hp),
          dmg: Math.round(T.dmg * m.dmg),
          sp: T.sp * m.sp
        }));
        n++;
      }
    });
  }
  G.cleared = false;
}

// Переход к следующей волне.
//
// Раньше волна появлялась только когда игрок сам отходил вправо. После киай,
// который выносит всю группу разом, Саша часто оставался у левого края — камера
// доезжала, новых врагов не было, и игра выглядела зависшей. Теперь появление
// волны зависит только от камеры, а игрока она подтягивает за собой.
function advanceWave(dt){
  if(!G.cleared || G.bossFight) return;

  const target = (G.seg + 1) * W;

  if(G.camX < target - 0.5){
    G.camX = Math.min(target, G.camX + Math.max(60, (target - G.camX) * 3) * dt);
    if(P.x < G.camX + 40) P.x = G.camX + 40;
    return;
  }

  G.camX = target;
  G.seg++;
  spawnWave();
}

/* ===== src/render/canvas.js ===== */
// Холст и общие помощники отрисовки.
const cv = document.getElementById("game");
cv.width = W;

function txt(s, x, y, size, color, align, weight){
  ctx.font = (weight || "bold") + " " + size + 'px "Arial Black",Arial,sans-serif';
  ctx.textAlign = align || "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}
function mono(s, x, y, size, color, align){
  ctx.font = "bold " + size + 'px Consolas,"Courier New",monospace';
  ctx.textAlign = align || "left";
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}
function drawShadow(x, y, r){
  ctx.fillStyle = "rgba(0,0,0,.32)";
  ctx.beginPath();
  ctx.ellipse(x, y, r, r * 0.34, 0, 0, 7);
  ctx.fill();
}
function panel(a){
  ctx.fillStyle = "rgba(8,10,16," + (a || 0.82) + ")";
  ctx.fillRect(0, 0, W, H);
}

// Отрисовка бойца — и Саши, и противников.
//
// Удар рисуется в три фазы через параметр o.ph (0..1):
//   до 0.28  — замах: подсед, кулак уходит к поясу, плечи разворачиваются назад
//   до 0.66  — выпад: корпус подаётся вперёд, конечность выстреливает на всю длину
//   далее    — возврат в стойку
// Урон в player.js проходит ровно в фазе выпада, чтобы картинка совпадала с попаданием.
//
// Поля o: facing, pose, ph, frame, scale, gi (цвет ги), sh (тень ги),
//         skin, hair, belt, stripe, emblem, band
function fighter(x, y, z, o){
  const s = o.scale||1, f = o.facing||1;
  drawShadow(x, y, 9*s);
  const b = y - z;
  const gi = o.gi||"#f2ede2", sh = o.sh||"#c9c2b4", skin = o.skin||"#e8b98f", hair = o.hair||"#241a12";
  const pose = o.pose||"idle", fr = o.frame||0;
  const ph = o.ph!==undefined ? Math.max(0, Math.min(1, o.ph)) : 0;

  // фазы удара: 0 — замах, 1 — выпад, 2 — возврат
  let ap = -1, ext = 0, lunge = 0;
  if(pose==="punch" || pose==="kick"){
    if(ph < 0.28){ const k = ph/0.28; ap = 0; ext = -0.22*k; lunge = -2*k; }
    else if(ph < 0.66){ const k = (ph-0.28)/0.38; ap = 1; ext = -0.22 + 1.22*Math.min(1, k*1.8); lunge = 4*Math.min(1, k*2); }
    else { const k = (ph-0.66)/0.34; ap = 2; ext = 1 - k; lunge = 4*(1-k); }
  }

  ctx.save(); ctx.translate(x, b); ctx.scale(s*f, s);

  if(pose === "down"){
    ctx.fillStyle = gi; ctx.fillRect(-16, -10, 30, 9);
    ctx.fillStyle = o.belt||"#000"; ctx.fillRect(-4, -10, 4, 9);
    ctx.fillStyle = skin; ctx.fillRect(14, -12, 9, 9);
    ctx.fillStyle = hair; ctx.fillRect(14, -14, 10, 4);
    ctx.restore(); return;
  }

  const lean = (pose==="hurt") ? -3 : 0;
  const bob = (pose==="idle") ? Math.sin(fr*0.6)*0.8 : 0;
  const crouch = (ap===0) ? 1.5 : 0;           // подсед на замахе
  const up = -crouch;                           // подъём тела

  /* ---- НОГИ ---- */
  ctx.fillStyle = gi;
  if(pose === "kick"){
    ctx.fillRect(-8, -13, 6, 13);               // опорная
    const L = 5 + 21*Math.max(0, ext);
    if(ap === 0){                               // колено поднято
      ctx.fillRect(0, -21, 9, 6);
      ctx.fillRect(6, -21, 5, 11);
      ctx.fillStyle = sh; ctx.fillRect(5, -11, 7, 3);
    } else {
      ctx.fillRect(0, -21, L, 6);               // нога вперёд
      ctx.fillStyle = sh; ctx.fillRect(L-3, -22, 7, 7);
    }
  } else if(pose === "walk"){
    const sw = Math.sin(fr)*4;
    ctx.fillRect(-8+sw, -13, 6, 13);
    ctx.fillRect(2-sw, -13, 6, 13);
  } else if(ap === 0){                          // подсед на замахе руки
    ctx.fillRect(-9, -12, 6, 12);
    ctx.fillRect(3, -12, 6, 12);
  } else if(pose === "punch"){
    ctx.fillRect(-10, -13, 6, 13);
    ctx.fillRect(3, -13, 6, 13);
  } else {
    ctx.fillRect(-8, -13, 6, 13);
    ctx.fillRect(2, -13, 6, 13);
  }
  ctx.fillStyle = sh;
  if(pose !== "kick"){ ctx.fillRect(-9, -2, 8, 2); ctx.fillRect(1, -2, 8, 2); }
  else ctx.fillRect(-9, -2, 8, 2);

  /* ---- КОРПУС (со сдвигом вперёд на выпаде) ---- */
  ctx.save(); ctx.translate(lunge, up);
  const twist = (ap===0) ? -2 : (ap===1 ? 2 : 0);   // разворот плеч

  ctx.fillStyle = o.belt||"#2f6fd0"; ctx.fillRect(-9, -17+bob, 18, 4);
  if(o.stripe){ ctx.fillStyle = o.stripe; ctx.fillRect(-9, -15.5+bob, 18, 1.4); }
  ctx.fillStyle = o.belt||"#2f6fd0";
  const bx = (ap===1) ? -5 : -3;
  ctx.fillRect(bx, -14+bob, 3, 6+ (ap===1?2:0)); ctx.fillRect(bx+4, -14+bob, 3, 5);

  ctx.fillStyle = gi; ctx.fillRect(-9+lean*0.4+twist*0.5, -30+bob, 18, 14);
  ctx.fillStyle = sh;
  ctx.beginPath();
  ctx.moveTo(-2+lean*0.4+twist*0.5, -30+bob); ctx.lineTo(6+lean*0.4+twist*0.5, -30+bob);
  ctx.lineTo(-2+lean*0.4+twist*0.5, -18+bob); ctx.fill();
  if(o.emblem){ ctx.fillStyle = "#c1272d"; ctx.fillRect(-7+twist*0.5, -28+bob, 4, 4); }

  const hy = -42+bob+lean;
  ctx.fillStyle = skin; ctx.fillRect(-5+twist*0.4, hy, 11, 11);
  ctx.fillStyle = hair; ctx.fillRect(-6+twist*0.4, hy-2, 13, 5); ctx.fillRect(-6+twist*0.4, hy, 3, 4);
  ctx.fillStyle = "#1a1a1a"; ctx.fillRect(2+twist*0.4, hy+4, 2, 2);
  if(o.band){ ctx.fillStyle = "#c1272d"; ctx.fillRect(-6+twist*0.4, hy+2, 13, 2.5); }

  /* ---- РУКИ ---- */
  ctx.fillStyle = gi;
  if(pose === "punch"){
    if(ap === 0){                                  // кулак у пояса, замах
      ctx.fillRect(-13, -27+bob, 10, 5);
      ctx.fillStyle = skin; ctx.fillRect(-16, -28+bob, 6, 6);
      ctx.fillStyle = gi; ctx.fillRect(2, -28+bob, 7, 5);
      ctx.fillStyle = skin; ctx.fillRect(7, -29+bob, 5, 5);
    } else {
      const L = 6 + 16*Math.max(0, ext);
      ctx.fillRect(4, -28+bob, L, 5);
      ctx.fillStyle = skin; ctx.fillRect(4+L, -29.5+bob, 7, 7);
      ctx.fillStyle = gi; ctx.fillRect(-11, -27+bob, 8, 5);  // отведённая назад
      if(ap === 1){                                 // след удара
        ctx.fillStyle = "rgba(255,255,255,.55)";
        ctx.fillRect(2, -30+bob, L, 1); ctx.fillRect(2, -24+bob, L-4, 1);
      }
    }
  } else if(pose === "kick"){
    ctx.fillRect(2, -30+bob, 7, 5); ctx.fillRect(-10, -26+bob, 7, 5);
    ctx.fillStyle = skin; ctx.fillRect(7, -31+bob, 5, 5); ctx.fillRect(-13, -27+bob, 5, 5);
    if(ap === 1){
      ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, -18-bob*0+bob, 22, -0.9, 0.25); ctx.stroke();
    }
  } else if(pose === "block"){
    ctx.fillRect(0, -36+bob, 6, 16);
    ctx.fillStyle = skin; ctx.fillRect(1, -38+bob, 5, 5);
    ctx.fillStyle = gi; ctx.fillRect(-6, -32+bob, 6, 12);
  } else if(pose === "kiai"){
    ctx.fillRect(-12, -32+bob, 8, 5); ctx.fillRect(6, -32+bob, 8, 5);
    ctx.fillStyle = skin; ctx.fillRect(-15, -33+bob, 5, 5); ctx.fillRect(13, -33+bob, 5, 5);
  } else if(pose === "hurt"){
    ctx.fillRect(-14, -30+bob, 7, 5); ctx.fillRect(7, -30+bob, 7, 5);
  } else {
    const sw = pose==="walk" ? Math.sin(fr)*2 : 0;
    ctx.fillRect(2, -28+bob+sw, 7, 5);
    ctx.fillRect(-8, -27+bob-sw, 7, 5);
    ctx.fillStyle = skin; ctx.fillRect(7, -29+bob+sw, 5, 5); ctx.fillRect(-10, -28+bob-sw, 5, 5);
  }
  ctx.restore();
  ctx.restore();
}

// Фоны уровней. Дальний план движется медленнее переднего — параллакс.
function drawBG(theme){
  const th = {

/* ===== src/player.js ===== */
// Логика Саши: движение, удары, блок, киай, получение урона.




// Длительность ударов. Урон проходит в средней фазе — в момент выпада.
const PUNCH_DUR = 0.30, PUNCH_FROM = 0.08, PUNCH_TO = 0.19;
const KICK_DUR  = 0.40, KICK_FROM  = 0.14, KICK_TO  = 0.28;

function isBusy(){
  return P.st === "punch" || P.st === "kick" || P.st === "hurt" || P.st === "kiai";
}
function updatePlayer(dt){
  if(P.dead){ P.st = "down"; return; }
  if(P.inv > 0) P.inv -= dt;
  P.stT += dt;

  const wasBusy = isBusy();

  if(!wasBusy){
    if(took("punch")){
      P.st = "punch"; P.stT = 0; P.hits = new Set(); faceNearest(); S.punch();
    } else if(took("kick")){
      P.st = "kick"; P.stT = 0; P.hits = new Set(); faceNearest(); S.kick();
    } else if(took("kiai") && P.spirit >= 100){
      P.st = "kiai"; P.stT = 0; P.spirit = 0;
      S.kiai(); G.shake = 1; G.flash = 0.7;
      doKiai();
    } else if(keys.block){
      if(P.st !== "block"){ P.st = "block"; P.stT = 0; }
    } else if(P.st === "block"){
      P.st = "idle";
    }
  }

  // Внимание: busy пересчитывается ПОСЛЕ обработки ввода.
  // Если взять старое значение, блок движения ниже сбросит только что начатый
  // удар обратно в стойку в том же кадре — и удар не нанесёт урона вообще.
  const busy = isBusy();
  const blocking = P.st === "block";

  if(!busy && !blocking){
    const dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    const dy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
    const sp = 78;
    if(dx || dy){
      const n = (dx && dy) ? 0.72 : 1;   // по диагонали не быстрее
      P.x += dx * sp * n * dt;
      P.y += dy * sp * 0.62 * n * dt;    // по глубине медленнее — так выглядит объёмнее
      if(dx) P.facing = dx;
      P.st = "walk";
      P.anim += dt * 9;
    } else if(P.st !== "idle"){
      P.st = "idle";
    }
  }

  // Границы арены.
  P.x = Math.max(G.camX + 12, Math.min(G.camX + W - 14, P.x));
  P.y = Math.max(182, Math.min(252, P.y));

  // Возврат в стойку.
  if(P.st === "punch" && P.stT > PUNCH_DUR) P.st = "idle";
  if(P.st === "kick"  && P.stT > KICK_DUR)  P.st = "idle";
  if(P.st === "hurt"  && P.stT > 0.32) P.st = "idle";
  if(P.st === "kiai"  && P.stT > 0.5)  P.st = "idle";

  // Активные кадры удара.
  if(P.st === "punch" && P.stT > PUNCH_FROM && P.stT < PUNCH_TO) attack(14, 30, 22, 10, 5);
  if(P.st === "kick"  && P.stT > KICK_FROM  && P.stT < KICK_TO)  attack(18, 36, 24, 18, 9);
}

// Фаза удара 0..1 — нужна отрисовке, чтобы показать замах, выпад и возврат.
function attackPhase(){
  if(P.st === "punch") return P.stT / PUNCH_DUR;
  if(P.st === "kick")  return P.stT / KICK_DUR;
  return 0;
}

// Доворот к ближайшему противнику. Без него ребёнок часто бьёт в пустоту.
function faceNearest(){
  let best = null, bd = 70;
  for(const e of G.enemies){
    if(e.dying) continue;
    const d = Math.abs(e.x - P.x) + Math.abs(e.y - P.y) * 1.4;
    if(d < bd){ bd = d; best = e; }
  }
  if(best && Math.abs(best.x - P.x) > 3) P.facing = best.x > P.x ? 1 : -1;
}

function attack(off, len, ry, dmg, kb){
  const hx = P.x + P.facing * (off + len / 2);
  for(const e of G.enemies){
    if(e.dying) continue;
    if(P.hits.has(e)) continue;      // один удар — одно попадание по цели
    if(Math.abs(e.x - hx) < len / 2 + 12 * e.big &&
       Math.abs(e.y - P.y) < ry &&
       Math.abs(e.z - P.z) < 30){
      P.hits.add(e);
      hitEnemy(e, dmg, kb);
    }
  }
}
function hitEnemy(e, dmg, kb){
  const T = TYPES[e.type];
  let d = dmg;

  if(e.st === "guard"){
    d = Math.max(1, Math.round(dmg * 0.2));   // блок почти всё гасит
    S.block();
  } else {
    S.hit();
    G.shake = Math.max(G.shake, 0.4);
  }

  e.hp -= d;
  e.hurt = 0.18;
  e.x += P.facing * kb * (e.boss ? 0.35 : 1);

  // Дух копится от попаданий. По манекенам — медленнее.
  P.spirit = Math.min(100, P.spirit + (T.stat ? 4 : 8));

  for(let i = 0; i < 4; i++){
    G.fx.push({ x: e.x, y: e.y - 22 * e.big, vx: (Math.random() - 0.5) * 90,
                vy: -30 - Math.random() * 60, t: 0, life: 0.35, c: "#e8b647" });
  }
  G.fx.push({ x: e.x, y: e.y - 24 * e.big, vx: 0, vy: 0, t: 0, life: 0.2, c: "#fff", big: 1 });
  G.fx.push({ x: e.x - P.facing * 6, y: e.y - 26 * e.big, vx: 0, vy: 0, t: 0, life: 0.14, c: "#fff", star: 1 });

  if(e.hp <= 0) killEnemy(e);
}

function killEnemy(e){
  e.dying = 0.001;
  e.st = "down";
  S.down();
  if(!e.boss && Math.random() < 0.3) G.items.push({ x: e.x, y: e.y, t: 0 });
  if(e.boss){ G.flash = 1; G.shake = 1.2; }
}

// Киай — удар духом по всем вокруг. Копится по шкале от попаданий.
function doKiai(){
  for(const e of G.enemies){
    if(e.dying) continue;
    if(Math.abs(e.x - P.x) < 92 && Math.abs(e.y - P.y) < 46){
      const back = e.x > P.x ? 1 : -1;
      e.hp -= 34;
      e.hurt = 0.3;
      e.x += back * 14;
      e.st = "hurt"; e.stT = 0; e.didHit = 0;
      if(e.hp <= 0) killEnemy(e);
    }
  }
  for(let i = 0; i < 20; i++){
    G.fx.push({ x: P.x, y: P.y - 20,
                vx: Math.cos(i / 20 * 6.28) * 150, vy: Math.sin(i / 20 * 6.28) * 70,
                t: 0, life: 0.45, c: "#c1272d" });
  }
}
function damagePlayer(d){
  if(P.inv > 0 || P.dead) return;

  if(P.st === "block"){
    d = Math.max(1, Math.round(d * 0.25));
    S.block();
    P.spirit = Math.min(100, P.spirit + 4);   // блок тоже копит дух
  } else {
    S.hurt();
    P.st = "hurt"; P.stT = 0;
    G.shake = Math.max(G.shake, 0.6);
  }

  P.hp -= d;
  P.inv = 0.75;

  if(P.hp <= 0){
    P.hp = 0;
    P.dead = true;
    G.lives--;
    if(G.lives <= 0){
      G.state = "gameover";
      G.screenT = 0;
      S.lose();
    } else {
      setTimeout(() => { if(G.state === "play") resetPlayer(false); }, 900);
    }
  }
}

/* ===== src/enemies.js ===== */
// Поведение противников, летящих снарядов и подбираемых предметов.
function updateEnemies(dt){
  for(let i=G.enemies.length-1;i>=0;i--){
    const e = G.enemies[i];
    if(e.dying){ e.dying += dt; if(e.dying > 0.9) G.enemies.splice(i,1); continue; }
    const T = TYPES[e.type];
    e.stT += dt; if(e.hurt>0) e.hurt -= dt; e.anim += dt*6;
    e.facing = P.x < e.x ? -1 : 1;

    // фазы босса
    if(e.type==="sensei"){
      const r = e.hp/e.maxhp;
      e.phase = r>0.66?1:(r>0.33?2:3);
    }
    const speedBoost = e.type==="sensei" ? (1 + (e.phase-1)*0.28) : 1;

    if(T.stat){ // манекен
      if(e.st!=="down") e.st = "idle";
      continue;
    }
    if(e.st==="hurt"){ if(e.stT>0.3) e.st="walk"; continue; }
    if(e.st==="attack"){
      if(!T.ranged){
        if(e.stT>0.18 && e.stT<0.3 && !e.didHit){
          e.didHit = 1;
          if(Math.abs(P.x-e.x) < T.reach+10*e.big && Math.abs(P.y-e.y) < 18 && !P.dead) damagePlayer(e.dmg);
        }
      } else {
        if(e.stT>0.25 && !e.didHit){
          e.didHit = 1;
          G.shots.push({ x:e.x + e.facing*10, y:e.y, z:14, vx:e.facing*115, dmg:e.dmg, t:0 });
          S.throwBall();
        }
      }
      if(e.stT>0.55){ e.st="walk"; e.cd = T.cd*(0.75+Math.random()*0.5)/speedBoost; e.didHit=0; }
      continue;
    }
    if(e.st==="guard"){
      e.guardT -= dt;
      if(e.guardT<=0){ e.st="walk"; e.cd = 0.35; }
      continue;
    }

    // движение
    const dx = P.x - e.x, dy = P.y - e.y;
    const dist = Math.abs(dx);
    let tx = 0, ty = 0;
    if(T.ranged){
      const want = 96;
      if(dist > want+16) tx = Math.sign(dx);
      else if(dist < want-16) tx = -Math.sign(dx);
      if(Math.abs(dy) > 5) ty = Math.sign(dy);
    } else {
      if(dist > T.reach - 4) tx = Math.sign(dx);
      if(Math.abs(dy) > 4) ty = Math.sign(dy);
    }
    const sp = e.sp * speedBoost;
    e.x += tx*sp*dt; e.y += ty*sp*0.55*dt;
    e.y = Math.max(182, Math.min(252, e.y));
    e.st = (tx||ty) ? "walk" : "idle";

    // вход на арену
    if(!e.entered && e.x < G.camX + W - 16) e.entered = true;
    if(e.entered) e.x = Math.max(G.camX+10, Math.min(G.camX+W-10, e.x));

    // атака
    e.cd -= dt;
    if(e.cd <= 0 && !P.dead){
      const inRange = T.ranged ? (dist < T.reach && Math.abs(dy) < 12)
                               : (dist < T.reach + 8*e.big && Math.abs(dy) < 16);
      if(inRange){
        if(T.guard && Math.random() < (e.type==="sensei"?0.2:0.4)){
          e.st="guard"; e.guardT = 0.7 + Math.random()*0.5; e.stT=0;
        } else { e.st="attack"; e.stT=0; e.didHit=0; }
      } else if(T.guard && dist < 70 && Math.random()<0.012){
        e.st="guard"; e.guardT=0.6; e.stT=0;
      }
    }
  }
}
function updateShots(dt){
  for(let i=G.shots.length-1;i>=0;i--){
    const s = G.shots[i]; s.x += s.vx*dt; s.t += dt;
    if(!P.dead && Math.abs(s.x-P.x)<11 && Math.abs(s.y-P.y)<12 && Math.abs(P.z-6)<24){
      damagePlayer(s.dmg); G.shots.splice(i,1); continue;
    }
    if(s.x < G.camX-20 || s.x > G.camX+W+20 || s.t>4) G.shots.splice(i,1);
  }
}
function updateItems(dt){
  for(let i=G.items.length-1;i>=0;i--){
    const it = G.items[i]; it.t += dt;
    if(Math.abs(it.x-P.x)<13 && Math.abs(it.y-P.y)<12){
      P.hp = Math.min(P.maxhp, P.hp+25); S.pick();
      G.fx.push({x:it.x,y:it.y-14,vx:0,vy:-40,t:0,life:0.5,c:"#8ee06a",big:1});
      G.items.splice(i,1); continue;
    }
    if(it.t > 16) G.items.splice(i,1);
  }
}

/* ===== src/render/world.js ===== */
// Отрисовка игрового мира: враги, игрок, предметы, снаряды, эффекты.
// Объекты сортируются по глубине Y, чтобы дальние были позади ближних.
function drawWorld(){
  ctx.save(); ctx.translate(-G.camX, 0);
  const list = [];
  for(const it of G.items) list.push({ y:it.y, f:()=>drawItem(it) });
  for(const e of G.enemies) list.push({ y:e.y, f:()=>drawEnemy(e) });
  if(!P.dead || G.lives>0) list.push({ y:P.y, f:()=>drawPlayer() });
  list.sort((a,b)=>a.y-b.y);
  for(const o of list) o.f();
  for(const s of G.shots){
    ctx.fillStyle="rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(s.x, s.y, 5,2,0,0,7); ctx.fill();
    ctx.fillStyle="#e8b647"; ctx.beginPath(); ctx.arc(s.x, s.y-s.z, 5,0,7); ctx.fill();
    ctx.fillStyle="#c1272d"; ctx.fillRect(s.x-4, s.y-s.z-1, 8, 2);
  }
  for(const f of G.fx){
    ctx.globalAlpha = Math.max(0, 1-f.t/f.life);
    ctx.fillStyle = f.c;
    if(f.star){
      const r = 5 + f.t*46;
      ctx.strokeStyle = f.c; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(f.x-r,f.y); ctx.lineTo(f.x+r,f.y);
      ctx.moveTo(f.x,f.y-r*0.7); ctx.lineTo(f.x,f.y+r*0.7);
      ctx.moveTo(f.x-r*0.6,f.y-r*0.5); ctx.lineTo(f.x+r*0.6,f.y+r*0.5);
      ctx.moveTo(f.x-r*0.6,f.y+r*0.5); ctx.lineTo(f.x+r*0.6,f.y-r*0.5);
      ctx.stroke();
    }
    else if(f.big){ const r = 4+f.t*40; ctx.beginPath(); ctx.arc(f.x,f.y,r,0,7); ctx.lineWidth=2; ctx.strokeStyle=f.c; ctx.stroke(); }
    else ctx.fillRect(f.x, f.y, 2, 2);
    ctx.globalAlpha = 1;
  }
  // стрелка «вперёд»
  if(G.cleared && !G.bossFight){
    const a = 0.55+0.45*Math.sin(G.t*7);
    ctx.globalAlpha = a; ctx.fillStyle="#e8b647";
    const ax = G.camX+W-34, ay = 150;
    ctx.beginPath(); ctx.moveTo(ax,ay-9); ctx.lineTo(ax+16,ay); ctx.lineTo(ax,ay+9); ctx.fill();
    ctx.fillRect(ax-14,ay-3,14,6);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function drawItem(it){
  const b = Math.sin(it.t*5)*2;
  ctx.fillStyle="rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(it.x,it.y,7,2.5,0,0,7); ctx.fill();
  ctx.fillStyle="#f6f2e8";
  ctx.beginPath(); ctx.moveTo(it.x, it.y-16+b); ctx.lineTo(it.x+7, it.y-4+b); ctx.lineTo(it.x-7, it.y-4+b); ctx.fill();
  ctx.fillStyle="#1c2330"; ctx.fillRect(it.x-4, it.y-8+b, 8, 4);
}

/* фигуры */

function drawPlayer(){
  if(P.dead && G.lives<=0) { fighter(P.x, P.y, 0, { facing:P.facing, pose:"down", belt:BELTS[G.beltIdx].c }); return; }
  if(P.dead){ fighter(P.x, P.y, 0, { facing:P.facing, pose:"down", belt:BELTS[G.beltIdx].c }); return; }
  if(P.inv > 0 && Math.floor(G.t*20)%2===0) return;
  const B = BELTS[G.beltIdx];
  let pose = P.st==="walk" ? "walk" : P.st;
  let ph = 0;
  ph = attackPhase();
  fighter(P.x, P.y, P.z, {
    facing:P.facing, pose, ph, frame: pose==="walk"?P.anim:G.t*2,
    gi:"#f7f4ec", sh:"#d8d2c4", belt:B.c, stripe:B.s, emblem:1, band:1, scale:1
  });
  if(P.st==="kiai" && P.stT<0.4){
    ctx.globalAlpha = 1-P.stT/0.4; ctx.strokeStyle="#c1272d"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(P.x, P.y-20, 30+P.stT*120, 14+P.stT*54, 0,0,7); ctx.stroke();
    ctx.globalAlpha=1;
  }
}
function drawEnemy(e){
  const T = TYPES[e.type];
  if(T.stat){
    // манекен / мешок
    const h = e.type==="bag" ? 46 : 40, w = e.type==="bag" ? 16 : 11;
    drawShadow(e.x, e.y, w*0.7);
    const tilt = e.hurt>0 ? Math.sin(G.t*40)*2 : 0;
    ctx.save(); ctx.translate(e.x+tilt, e.y);
    if(e.dying){ ctx.rotate(Math.min(1.4, e.dying*2)); }
    if(e.type!=="bag"){ ctx.fillStyle="#4a3a26"; ctx.fillRect(-w/2-3, -6, w+6, 6); } // основание стойки
    ctx.fillStyle = T.gi; ctx.fillRect(-w/2, -h, w, h);
    ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.fillRect(-w/2, -h, 3, h);
    ctx.fillStyle = T.belt;
    for(let y=-h+6; y<-6; y+=9) ctx.fillRect(-w/2, y, w, 3);   // соломенная обмотка
    // мишень
    ctx.fillStyle = "#c1272d"; ctx.beginPath(); ctx.arc(0, -h+13, 6, 0, 7); ctx.fill();
    ctx.fillStyle = "#f7f4ec"; ctx.beginPath(); ctx.arc(0, -h+13, 3, 0, 7); ctx.fill();
    ctx.fillStyle = "#c1272d"; ctx.beginPath(); ctx.arc(0, -h+13, 1.4, 0, 7); ctx.fill();
    ctx.restore();
    if(!e.dying){
      const hp = Math.max(0, e.hp/e.maxhp);
      ctx.fillStyle="rgba(0,0,0,.5)"; ctx.fillRect(e.x-10, e.y-h-10, 20, 3);
      ctx.fillStyle= hp>0.5?"#8ee06a":(hp>0.25?"#e8b647":"#c1272d");
      ctx.fillRect(e.x-10, e.y-h-10, 20*hp, 3);
    }
  } else {
    let pose = "idle", ph = 0;
    if(e.dying) pose = "down";
    else if(e.st==="attack"){
      pose = (e.type==="kabe" || e.type==="sensei") ? "kick" : "punch";
      ph = e.stT/0.55;
    }
    else if(e.st==="guard") pose = "block";
    else if(e.st==="hurt" || e.hurt>0) pose = "hurt";
    else if(e.st==="walk") pose = "walk";
    let gi = T.gi;
    if(e.type==="sensei" && e.phase>1) gi = e.phase===2 ? "#3b2530" : "#4a1d20";
    if(e.hurt>0 && Math.floor(G.t*30)%2===0) gi = "#ffffff";
    fighter(e.x, e.y, e.z, {
      facing:e.facing, pose, ph, frame:e.anim, gi, sh:"#9aa0ad",
      belt:T.belt, stripe: e.type==="sensei"?"#e8b647":null, scale:e.big, skin:"#d9a97e",
      hair: e.boss?"#0e0e12":"#2b2018", band: e.boss?1:0
    });
    // мини-полоска здоровья у обычных
    if(!e.boss && !e.dying){
      const w = 18*e.big, hp = Math.max(0,e.hp/e.maxhp);
      ctx.fillStyle="rgba(0,0,0,.5)"; ctx.fillRect(e.x-w/2, e.y-52*e.big, w, 3);
      ctx.fillStyle= hp>0.5?"#8ee06a":(hp>0.25?"#e8b647":"#c1272d");
      ctx.fillRect(e.x-w/2, e.y-52*e.big, w*hp, 3);
    }
  }
}

  mono("ДУХ", hx, 31, 7, "#8b95ad");
  ctx.fillStyle = "#141c2c"; ctx.fillRect(hx+22, 25, 98, 5);
  ctx.fillStyle = P.spirit>=100 ? (Math.floor(G.t*8)%2?"#fff":"#5b55c4") : "#2f6fd0";
  ctx.fillRect(hx+22, 25, 98*(P.spirit/100), 5);

  // жизни
  for(let i=0;i<G.lives;i++){
    const x = 196+i*13;
    ctx.fillStyle="#f7f4ec"; ctx.fillRect(x, 14, 9, 9);
    ctx.fillStyle="#c1272d"; ctx.fillRect(x, 20, 9, 2);

  // уровень
  mono("УРОВЕНЬ "+(G.lvl+1)+"/"+LEVELS.length, W-8, 12, 8, "#8b95ad", "right");
  txt(LEVELS[G.lvl].name, W-8, 26, 10, "#f2ede2", "right");

  // босс
  const boss = G.enemies.find(e=>e.boss && !e.dying);
  if(boss){
    ctx.fillStyle="rgba(10,12,20,.7)"; ctx.fillRect(90,40,300,16);
    mono(boss.name, 240, 47, 7, "#e8b647", "center");

    ctx.fillStyle="#c1272d"; ctx.fillRect(100,49,280*Math.max(0,boss.hp/boss.maxhp),4);
  }

  if(G.msgT>0 && G.msg){
    ctx.globalAlpha = Math.min(1, G.msgT*2);
    txt(G.msg, 240, 92, 16, "#e8b647", "center");
    ctx.globalAlpha = 1;
  }
}

/* ===== src/game.js ===== */
// Главный цикл: обновление логики и отрисовка кадра.











let last = 0;
function startLoop(){
  last = performance.now();
  requestAnimationFrame(loop);
}

function loop(now){
  // Ограничение шага: после сворачивания вкладки dt был бы огромным
  // и объекты «телепортировались» бы сквозь друг друга.
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  G.t += dt;
  G.screenT += dt;
  if(G.shake > 0) G.shake = Math.max(0, G.shake - dt * 3);
  if(G.flash > 0) G.flash = Math.max(0, G.flash - dt * 3);
  if(G.msgT > 0) G.msgT -= dt;

  try {
    update(dt);
    render();
  } catch(err){
    // Ошибка в одном кадре не должна убивать игру целиком.
    console.error("Ошибка в кадре:", err);
  }

  requestAnimationFrame(loop);
}

function update(dt){
  switch(G.state){
    case "title":    return updateTitle();
    case "intro":    return updateIntro();
    case "belt":     return updateBelt();
    case "gameover": return updateGameOver();
    case "win":      return updateWin();
    case "pause":    return updatePause();
    case "play":     return updatePlay(dt);
  }
}

function updateTitle(){
  if(G.unlocked > 1){
    if(took("left"))  G.selLevel = (G.selLevel + G.unlocked - 1) % G.unlocked;
    if(took("right")) G.selLevel = (G.selLevel + 1) % G.unlocked;
  }
  if(took("enter")) startLevel(G.selLevel);
}

function updateIntro(){
  if((G.screenT > 1.4 && took("enter")) || G.screenT > 5){
    G.state = "play";
    spawnWave();
  }
}

function updateBelt(){
  if(G.screenT > 1.2 && took("enter")){
    if(G.lvl + 1 >= LEVELS.length){
      G.state = "win";
      G.screenT = 0;
    } else {
      G.unlocked = Math.max(G.unlocked, G.lvl + 2);
      saveProgress();
      startLevel(G.lvl + 1);
    }
  }
}

function updateGameOver(){
  if(G.screenT > 0.8 && took("enter")) startLevel(G.lvl);
}

function updateWin(){
  if(took("enter")){ G.state = "title"; G.screenT = 0; }
}

function updatePause(){
  if(took("pause") || took("enter")) G.state = "play";
}

function updatePlay(dt){
  if(took("pause")){ G.state = "pause"; return; }

  updatePlayer(dt);
  updateEnemies(dt);
  updateShots(dt);
  updateItems(dt);

  for(let i = G.fx.length - 1; i >= 0; i--){
    const f = G.fx[i];
    f.t += dt;
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    if(f.t > f.life) G.fx.splice(i, 1);
  }

  // Волна зачищена?
  const alive = G.enemies.filter(e => !e.dying).length;
  if(alive === 0 && !G.cleared){
    G.cleared = true;
    if(G.bossFight){
      G.state = "belt";
      G.screenT = 0;
      S.belt();
      G.unlocked = Math.max(G.unlocked, G.lvl + 2);
      saveProgress();
    } else {
      G.msg = "ВПЕРЁД →";
      G.msgT = 1.6;
    }
  }

  advanceWave(dt);
}

function render(){
  ctx.save();

  if(G.shake > 0){
    ctx.translate((Math.random() - 0.5) * G.shake * 5, (Math.random() - 0.5) * G.shake * 4);
  }

  if(G.state === "title"){
    drawTitle();
  } else if(G.state === "win"){
    drawWin();
  } else {
    drawBG(LEVELS[G.lvl].theme);
    drawWorld();
    drawHUD();
    if(G.state === "intro")    drawIntro();
    if(G.state === "belt")     drawBelt();
    if(G.state === "gameover") drawGameOver();
    if(G.state === "pause")    drawPause();
  }

  if(G.flash > 0){
    ctx.fillStyle = "rgba(255,255,255," + (G.flash * 0.35) + ")";
    ctx.fillRect(0, 0, W, H);
  }

  ctx.restore();
}
